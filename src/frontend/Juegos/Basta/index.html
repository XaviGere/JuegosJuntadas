<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basta! - Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-izq">
            <a href="../../index.html" class="btn-volver">⬅ Volver al Hub</a>
            <h1 id="tituloSalaJuego">Basta!</h1>
        </div>
        <div class="nav-der">
            <div id="rondaDisplay" class="ronda-badge">Ronda 1 / 3</div>
        </div>
    </header>

    <div class="layout-juego">
        
        <!-- PANEL IZQUIERDO EN PC (ORDER 3 EN CELULAR) -->
        <aside class="panel-jugadores">
            <h2>Orden de Juego</h2>
            <p class="subtitulo">Acierta una letra o usa Pasapalabra.</p>
            <div id="listaJugadoresJuego" class="lista-turnos"></div>
        </aside>

        <!-- PANEL CENTRAL EN PC (ORDER 2 EN CELULAR) -->
        <main class="panel-tablero">
            <div class="ruleta-contenedor" id="ruletaContenedor">
                <svg id="roscoSVG"></svg>
                
                <div id="letrasHTMLContenedor"></div>
                
                <div class="reloj" id="contador" onclick="tocarReloj()">▶</div>
            </div>
        </main>
        
        <!-- PANEL DERECHO EN PC (ORDER 1 EN CELULAR) -->
        <aside class="panel-lateral">
            <div class="btn-lateral btn-categoria" onclick="tirarCategoria()">
                <span>CATEGORÍA</span>
                <div id="textoCategoria">Toca para elegir</div>
            </div>

            <div class="btn-lateral btn-pausa" onclick="alternarPausa()" id="btnPausa">
                <span>CONTROL</span>
                <div>Pausar Juego</div>
            </div>

            <div class="btn-lateral btn-reiniciar" onclick="reiniciarRondaManual()">
                <span>RONDA</span>
                <div>Reiniciar Ronda</div>
            </div>

            <div class="btn-lateral btn-config" onclick="abrirConfigJuego()">
                <span>AJUSTES</span>
                <div>⚙️ Configuración</div>
            </div>
        </aside>

    </div>

    <!-- MODALES Y TOASTS -->
    <div id="toastContainer" class="toast-container"></div>

    <div class="modal-overlay" id="modalConfirm">
        <div class="modal-contenido modal-pequeno">
            <h2 id="confirmTitulo">Atención</h2>
            <p id="confirmMensaje">¿Estás seguro?</p>
            <div class="modal-botones-fila">
                <button class="btn-cancelar" onclick="cerrarConfirmacion()">Cancelar</button>
                <button class="btn-guardar" id="btnConfirmarAccion">Sí, estoy seguro</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalConfigJuego">
        <div class="modal-contenido modal-scrollable">
            <div class="modal-header-config">
                <h2>Ajustes de la Partida</h2>
                <div class="opcion-modo-oscuro">
                    <span>🌙</span>
                    <label class="switch">
                        <input type="checkbox" id="checkModoOscuro" onchange="alternarModoOscuro()">
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
            
            <div class="seccion-form-fila">
                <div class="seccion-form">
                    <label><b>Tiempo (seg):</b></label>
                    <input type="number" id="inputTiempo" min="5" max="60">
                </div>
                <div class="seccion-form">
                    <label><b>Rondas:</b></label>
                    <input type="number" id="inputRondas" min="1" max="99">
                </div>
                <div class="seccion-form">
                    <label><b>Max. Pasapalabras:</b></label>
                    <input type="number" id="inputPasapalabras" min="0" max="10">
                </div>
            </div>

            <div class="seccion-form-fila">
                <div class="seccion-form">
                    <label><b>Forma del Tablero:</b></label>
                    <select id="selectFormaTablero">
                        <option value="disco">Disco (Rosco Continuo)</option>
                        <option value="circulos">Círculos Separados</option>
                        <option value="cuadrado">Cuadrado (Vértices fijos)</option>
                    </select>
                </div>
            </div>

            <div class="seccion-form">
                <label><b>Pasapalabras tras cada ronda:</b></label>
                <select id="selectReglaPasapalabra">
                    <option value="reset">Reiniciar al máximo seteado</option>
                    <option value="add1">Sumar 1 (sin superar el máximo)</option>
                    <option value="none">No sumar (mantener los que quedaron)</option>
                </select>
            </div>

            <div class="seccion-form opcion-checkbox">
                <label><b>Modo Completitud:</b></label>
                <label class="switch">
                    <input type="checkbox" id="checkCompletitud" onchange="toggleTiempoExtra()">
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="seccion-form" id="divTiempoExtra" style="display: none; padding-left: 15px; border-left: 3px solid var(--primary-color);">
                <label><b>Segundos extra por turno (al quedar solo):</b></label>
                <input type="number" id="inputTiempoExtra" min="0" max="60" value="0">
            </div>

            <hr class="divisor">

            <div class="seccion-form">
                <label><b>Letras en juego:</b> <small>(Toca para activar)</small></label>
                <div class="selector-letras-grid" id="gridLetrasConfig"></div>
            </div>

            <div class="seccion-form">
                <label><b>Categorías:</b></label>
                <div class="agregar-categoria-form">
                    <input type="text" id="inputNuevaCat" placeholder="Nueva categoría...">
                    <button class="btn-secundario" onclick="agregarCategoria()">Agregar</button>
                </div>
                <div class="lista-categorias-manager" id="listaCatConfig"></div>
            </div>

            <div class="modal-botones-columna">
                <button class="btn-guardar" onclick="guardarConfigJuego()">Aplicar y seguir jugando</button>
                <button class="btn-peligro" onclick="pedirReinicioCompleto()">Reiniciar TODA la Partida</button>
                <button class="btn-cancelar" onclick="document.getElementById('modalConfigJuego').style.display = 'none'">Cerrar Configuración</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
